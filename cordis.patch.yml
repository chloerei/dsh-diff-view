# dsh-diff-viewer bundle patch: one row carrying both halves.
#
# The Host half registers the read-only `GET /dsh-diff-viewer/diff` route; the
# browser half (`dsh.client` in package.json) registers the right sidebar's
# `git-diff` tab type against that same row. Selecting this bundle appends the
# row to the profile tree; it needs no other layer.
- insert:
    - id: diff-viewer
      name: 'dsh-diff-viewer'
